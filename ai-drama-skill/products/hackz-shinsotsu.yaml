# 商材定義: ハックツ新卒
id: hackz-shinsotsu
name: ハックツ新卒
target: 就活中の大学生（{{grad_year}}卒。文理問わず・特定職種に絞らない）。「ゆるく働きたい」層に強い
grad_year: 27卒・28卒        # 台本内の年度呼びはここを差し替える
pain_examples:
  - 50社エントリーして内定ゼロ、秋になった
  - 一人で就活している（ES添削も面接練習も誰にも見せていない）
  - 大学名で落とされていると思っている（Fラン自虐）
  - 周りは内定、自分だけ無い焦り
nickname: 就活の裏ルート
benefit_one_liner: 就活のプロ（キャリアアドバイザー）が1対1でついて、非公開求人を紹介してくれる
mechanism: ES添削・面接対策・企業選びまで全部無料で伴走。週休3日・初任給30万などの非公開求人も
proof:
  - 内定率94%（※当社実績）
  - 非公開求人多数（週休3日・初任給30〜40万・ボーナス年3回など ※求人による）
offer: 完全無料・LINEで30秒〜1分
scarcity: 非公開求人は人気順にすぐ埋まる
cta_text: LINEで30秒、無料で相談
disclaimers:
  - ※結果には個人差があります
  - ※イメージ動画です
  - ※数値は当社実績
ng_words:
  - 1週間で内定 → 最短1週間※求人による
  - サクッと取れる／絶対 → 使わない
  - 初任給○万・週休3日 → 必ず「※求人による」を添える
voices:
  protagonist: 大学生（男女）
  guide: 社会人1〜2年目の兄姉／先輩、または同期

# --- 訴求仮説（docs/既存訴求の分解_2026-10-06.md）。1本の台本では A か B のどちらか1つだけ使う。合体しない ---
hypothesis_A:            # 求人サイト否定
  enemy_lines:
  - ナビサイトから一人で出すの絶対やめて
  - ナビサイトって上位校向けだから
  - うちの大学から突撃しても、嫌な顔されてお祈りされるのがオチ
  definition: 自分と相性のいい就活のプロを紹介してくれる
  benefit_lines:
    - ネットに出てない非公開求人も紹介してくれる
    - ES添削も面接練習も全部やってくれる
hypothesis_B:            # エージェント否定（担当者ガチャ）
  enemy_lines:
  - あー、担当ガチャ外れたね
  - ハズレ担当は返信遅いし、合う求人がないと放置する
  definition: エージェントじゃなくて、評価の高いプロを紹介してくれるサービス
  benefit_lines:
    - 口コミで「自分じゃ出会えないプロに会えた」って
    - LINE登録1分で紹介してくれる
result_claims:           # 説明役が自分の結果として言う（※求人による）
  - 週休3日
  - 初任給30万
  - ボーナス年3回
reassurance: 大学名に自信なくても全然大丈夫、マジでプロだから
banned_explanations:     # 説明的すぎるので台本に入れない
  - 1,000人以上の認定CAから1人（LPの約束。動画では言わない）
  - 事前に希望を聞いて／合わなかったら変更できる
  - 企業側がお金を払う仕組み
