# 商材定義: ハックツ就職
# 台本テンプレ（templates/beats.md）の {{スロット}} をここから埋める。
id: hackz-shushoku
name: ハックツ就職
target: 20代の未経験転職（第二新卒・既卒・フリーター・販売/飲食/アパレルなど非IT層）。男女両方
pain_examples:            # ビート2「欠点の指摘」で使う本人の痛み
  - 手取り18万・シフト制で土日働いている
  - フリーターのまま25歳、正社員に30社落ちた
  - 飛び込み営業で毎日怒られる・残業月60時間
  - 親や彼氏/彼女の親に「いつまでそれやるの」と言われた
nickname: ホワイト企業の裏ルート   # 商品の言い換え名（参考広告の「お口の香水」相当）
benefit_one_liner: 1,000人以上の認定キャリアアドバイザーから、あなたに合う1名を紹介してくれる
mechanism: その1人が、隠れホワイト企業（年収500万以上・土日祝休み・残業なし）の非公開求人を持ってくる
proof:                    # ビート4「権威」。※当社実績の注記を必ず添える
  - 支援実績1万件以上
  - 入社した人の満足度98%
  - 平均年収93万円UP
offer: 完全無料・完全オンライン（企業側が費用を払う仕組み）
scarcity: 非公開求人は枠が埋まり次第終了。早い者勝ち
cta_text: LINEで30秒、無料で相談
disclaimers:               # 画面下に常時表示
  - ※結果には個人差があります
  - ※イメージ動画です
  - ※数値は当社実績
ng_words:                  # 景表法・職安法対策
  - 1週間で内定 → 最短1週間※求人による
  - 絶対／必ず／誰でも → 使わない
  - 年収○万円 → 必ず「※求人による」を添える
voices:
  protagonist: 20代女性 or 男性（悩み側）
  guide: 20代後半〜30代（成功側・落ち着いた声）

# --- 訴求仮説（docs/既存訴求の分解_2026-10-06.md）。1本の台本では A か B のどちらか1つだけ使う。合体しない ---
hypothesis_A:            # 求人サイト否定
  enemy_lines:
  - ネットで探すの絶対やめて
  - 求人サイトってハイスペ向けだから
  - 私たちみたいな高卒が突撃しても、嫌な顔されてお祈りされるのがオチ
  definition: 自分と相性のいい転職のプロを紹介してくれる
  benefit_lines:
    - 未経験でもなんとかして条件いい会社にねじ込んでくれる
    - 履歴書も面接対策も全部やってくれる
hypothesis_B:            # エージェント否定（担当者ガチャ）
  enemy_lines:
  - それ、担当ガチャに外れたんだよ
  - 転職って担当者で決まるの。ハズレ担当は合う求人がないと後回しにする
  definition: エージェントじゃなくて、評価の高いプロを紹介してくれるサービス
  benefit_lines:
    - 口コミで「自分じゃ出会えないプロに会えた」って
    - LINE登録1分で紹介してくれる
result_claims:           # 説明役が自分の結果として言う（※求人による）
  - 手取り40万
  - 週休3日
  - ボーナス年3回
  - 半年で手取り32万
reassurance: 経歴に自信なくても全然大丈夫、マジでプロだから
banned_explanations:     # 説明的すぎるので台本に入れない
  - 1,000人以上の認定CAから1人（LPの約束。動画では言わない）
  - 事前に希望を聞いて／合わなかったら変更できる
  - 企業側がお金を払う仕組み
